<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gazzera Viva - App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Elimina lo scroll della pagina */
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #FAF2E7;
            color: #1c5222;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh; /* Blocca l'altezza all'area visibile dello schermo */
            background-color: #FDF0E0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        header {
            background-color: #FF851B;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .logo-img {
            max-height: 65px;
            width: auto;
            display: block;
        }

        .header-text {
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            text-align: right;
            line-height: 1.2;
        }

        /* PER ORA NASCOSTO: Sezione Sostenitori */
        .sostenitori-section {
            display: none; /* Cambia in 'block' per farli riapparire */
            padding: 10px 15px;
            flex-shrink: 0;
        }

        .sostenitori-title {
            font-size: 12px;
            color: #555;
            margin-bottom: 5px;
        }

        .sostenitori-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .sostenitore-card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .hero-section {
            text-align: center;
            padding: 5px 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0; /* Permette all'immagine di ridimensionarsi sui telefoni piccoli */
        }

        .mascotte-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 35vh; /* Limita l'altezza della mascotte per farla apparire più piccola */
            min-height: 0;
        }

        .mascotte-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .hero-title-small {
            font-size: 18px;
            color: #1c5222;
            margin-top: 4px;
        }

        .hero-title-main {
            font-size: 38px;
            font-weight: 900;
            color: #116b25;
            letter-spacing: 1px;
            line-height: 1;
        }

        .hero-subtitle {
            font-size: 16px;
            color: #1c5222;
            font-weight: 500;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            padding: 10px 10px;
            text-align: center;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .nav-item img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-bottom: 3px;
        }

        .nav-item span {
            font-size: 12px;
            font-weight: bold;
            color: #116b25;
        }

        footer {
            background-color: #FF851B;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .info-btn img {
            height: 38px;
            width: auto;
            display: block;
        }

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .social-icons a img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <header>
            <a href="#">
                <img src="logo.jpg" alt="Gazzera Viva Logo" class="logo-img">
            </a>
            <div class="header-text">
                Associazione<br>
                Commercianti<br>
                Artigiani<br>
                Gazzera
            </div>
        </header>

        <!-- Sezione Sostenitori (Nascosta dal CSS) -->
        <section class="sostenitori-section">
            <div class="sostenitori-title">Sostenitori</div>
            <div class="sostenitori-grid">
                <a href="#" class="sostenitore-card">

                <a href="#" class="sostenitore-card">

                <a href="#" class="sostenitore-card">

        <section class="hero-section">

            <div class="hero-title-small">Ciao sono</div>

        <!-- MENU CON ICONE VETTORIALI IN VERDE -->
        <nav class="nav-grid">

                <svg class="nav-icon-svg" viewBox="0 0 24 24">
                    <path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h6v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/>
                </svg>
                <span>Prodotti</span>

            <!-- Negozi (Negozio / Vetrina) -->

                <svg class="nav-icon-svg" viewBox="0 0 24 24">
                    <path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/>
                </svg>
                <span>Negozi</span>
            </a>

            <!-- Eventi (Calendario) -->
            <a href="https://padlet.com/gazzeraviva/eventi-4qrhweyz8479wr2j" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24">
                    <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>

            </a>

            <!-- Community (Persone / Gruppo) -->
            <a href="https://padlet.com/gazzeraviva/community-eatejib5395ro1y0" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <span>Community</span>
            </a>
        </nav>

        <footer>

                <img src="telefono.jpg" alt="INFO 3518731413">
            </a>
            <div class="social-icons">

                    <img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" alt="WhatsApp">
                </a>

                </a>
                <a href="https://t.me/commerciantigazzera" target="_blank">

                </a>
            </div>
        </footer>

    </div>

</body>
</html>
