<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gazzera Viva - App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Elimina lo scroll della pagina */
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #FAF2E7;
            color: #1c5222;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh; /* Blocca l'altezza all'area visibile dello schermo */
            background-color: #FDF0E0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        header {
            background-color: #FF851B;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .logo-img {
            max-height: 65px;
            width: auto;
            display: block;
        }

        .header-text {
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            text-align: right;
            line-height: 1.2;
        }

        /* PER ORA NASCOSTO: Sezione Sostenitori */
        .sostenitori-section {
            display: none; /* Cambia in 'block' per farli riapparire */
            padding: 10px 15px;
            flex-shrink: 0;
        }

        .sostenitori-title {
            font-size: 12px;
            color: #555;
            margin-bottom: 5px;
        }

        .sostenitori-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .sostenitore-card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .hero-section {
            text-align: center;
            padding: 5px 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0; /* Permette all'immagine di ridimensionarsi sui telefoni piccoli */
        }

        .mascotte-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 35vh; /* Limita l'altezza della mascotte per farla apparire più piccola */
            min-height: 0;
        }

        .mascotte-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .hero-title-small {
            font-size: 18px;
            color: #1c5222;
            margin-top: 4px;
        }

        .hero-title-main {
            font-size: 38px;
            font-weight: 900;
            color: #116b25;
            letter-spacing: 1px;
            line-height: 1;
        }

        .hero-subtitle {
            font-size: 16px;
            color: #1c5222;
            font-weight: 500;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            padding: 10px 10px;
            text-align: center;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .nav-item img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-bottom: 3px;
        }

        .nav-item span {
            font-size: 12px;
            font-weight: bold;
            color: #116b25;
        }

        footer {
            background-color: #FF851B;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .info-btn img {
            height: 38px;
            width: auto;
            display: block;
        }

        .social-icons {
            display: flex;
            gap: 12px;
        }

        .social-icons a img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <header>
            <a href="#">
                <img src="logo.jpg" alt="Gazzera Viva Logo" class="logo-img">
            </a>
            <div class="header-text">
                Associazione<br>
                Commercianti<br>
                Artigiani<br>
                Gazzera
            </div>
        </header>

        <!-- Sezione Sostenitori (Nascosta dal CSS) -->
        <section class="sostenitori-section">
            <div class="sostenitori-title">Sostenitori</div>
            <div class="sostenitori-grid">
                <a href="#" class="sostenitore-card">
                    <img src="sostenitore1.jpg" alt="Sostenitore 1">
                </a>
                <a href="#" class="sostenitore-card">
                    <img src="sostenitore2.jpg" alt="Sostenitore 2">
                </a>
                <a href="#" class="sostenitore-card">
                    <img src="sostenitore3.jpg" alt="Sostenitore 3">
                </a>
            </div>
        </section>

        <section class="hero-section">
            <div class="mascotte-wrapper">
                <a href="#" style="display: flex; justify-content: center; height: 100%;">
                    <img src="mascot asso.jpg" alt="Mascotte Asso" class="mascotte-img">
                </a>
            </div>
            <div class="hero-title-small">Ciao sono</div>
            <div class="hero-title-main">ASSO</div>
            <div class="hero-subtitle">Mascotte dell'associazione</div>
        </section>

        <nav class="nav-grid">
            <a href="https://padlet.com/gazzeraviva/offerte-antispreco-jb0svs3ohqs8ry04" class="nav-item">
                <img src="prodotti.jpg" alt="Prodotti">
                <span>Prodotti</span>
            </a>
            <a href="https://padlet.com/commerciantigazzera/negozi-di-vicinato-jg2p0mn3fdllv7fg" class="nav-item">
                <img src="negozi.jpg" alt="Negozi">
                <span>Negozi</span>
            </a>
            <a href="https://padlet.com/gazzeraviva/eventi-4qrhweyz8479wr2j" class="nav-item">
                <img src="eventi.jpg" alt="Eventi">
                <span>Eventi</span>
            </a>
            <a href="https://padlet.com/gazzeraviva/community-eatejib5395ro1y0" class="nav-item">
                <img src="comunity.jpg" alt="Community">
                <span>Community</span>
            </a>
        </nav>

        <footer>
            <a href="tel:+393518731413" target="_blank" class="info-btn">
                <img src="telefono.jpg" alt="INFO 3518731413">
            </a>
            <div class="social-icons">
                <a href="https://wa.me/393518731413" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" alt="WhatsApp">
                </a>
                <a href="https://www.facebook.com/Associazione-Commercianti-Artigiani-Gazzera-566431173530554/" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="Facebook">
                </a>
                <a href="https://t.me/commerciantigazzera" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram">
                </a>
                <a href="https://www.instagram.com/commercianti.gazzera/" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/512/1409/1409946.png" alt="Instagram">
                </a>
            </div>
        </footer>

    </div>

</body>
</html>
