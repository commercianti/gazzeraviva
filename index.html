<!DOCTYPE html>
<html lang="it">
<head>
    <!-- Configurazione di base della pagina -->
    <meta charset="UTF-8">
    <!-- Adatta la pagina allo schermo degli smartphone disabilitando lo zoom involontario -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gazzera Viva - App</title>
    
    <style>
        /* ======================================================
           1. RESET E REGOLAZIONI GENERALI DELLA PAGINA
           ====================================================== */
        * {
            box-sizing: border-box; /* Include margini e bordi nel calcolo delle dimensioni */
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Blocca lo scorrimento della pagina per simular un'app mobile */
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #FAF2E7; /* Colore di sfondo dell'intero sito (crema) */
            color: #1c5222; /* Colore del testo principale (verde) */
            display: flex;
            justify-content: center; /* Centra l'app orizzontalmente */
            align-items: center;     /* Centra l'app verticalmente */
        }

        /* ======================================================
           2. CONTENITORE PRINCIPALE (SCHERMO DELL'APP)
           ====================================================== */
        .app-container {
            width: 100%;
            max-width: 480px; /* Limita la larghezza per simulare un telefono */
            height: 100vh;
            height: 100dvh;   /* Adatta perfettamente l'altezza allo schermo visibile dei telefoni */
            background-color: #FDF0E0;
            display: flex;
            flex-direction: column; /* Dispone gli elementi dall'alto verso il basso */
            justify-content: space-between; /* Distribuisce lo spazio tra header, corpo e footer */
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1); /* Ombra esterna per dare profondità */
        }

        /* ======================================================
           3. INTESTAZIONE (HEADER)
           ====================================================== */
        header {
            background-color: #FF851B; /* Arancione principale */
            padding: 8px 12px;
            display: flex;
            justify-content: space-between; /* Spinge il logo a sinistra e il testo a destra */
            align-items: center;
            flex-shrink: 0; /* Impedisce alla barra di schiacciarsi */
        }

        /* Dimensione dell'icona del logo "GAZZERA VIVA" */
        .logo-img {
            max-height: 65px;
            width: auto;
            display: block;
        }

        /* Testo "Associazione Commercianti Artigiani Gazzera" INGRANDITO */
        .header-text {
            color: #ffffff;
            font-size: 14px; /* Aumentato da 12px per maggiore leggibilità */
            font-weight: bold;
            text-align: right;
            line-height: 1.25;
        }

        /* ======================================================
           4. SEZIONE SOSTENITORI (ATTUALMENTE NASCOSTA)
           ====================================================== */
        .sostenitori-section {
            display: none; /* Cambia in 'block' per far riapparire la sezione */
            padding: 10px 15px;
            flex-shrink: 0;
        }

        .sostenitori-title {
            font-size: 12px;
            color: #555;
            margin-bottom: 5px;
        }

        .sostenitori-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 colonne uguali */
            gap: 8px;
        }

        .sostenitore-card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        /* ======================================================
           5. SEZIONE CENTRALE (HERO / MASCOTTE)
           ====================================================== */
        .hero-section {
            text-align: center;
            padding: 5px 15px;
            flex: 1; /* Prende tutto lo spazio verticale disponibile */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        /* Contenitore e dimensione della Mascotte */
        .mascotte-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 35vh; /* Limita l'altezza per rendere la mascotte più piccola */
            min-height: 0;
        }

        .mascotte-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Mantiene le proporzioni dell'immagine */
        }

        /* Testi sotto la mascotte */
        .hero-title-small {
            font-size: 18px;
            color: #1c5222;
            margin-top: 4px;
        }

        .hero-title-main {
            font-size: 38px;
            font-weight: 900;
            color: #116b25;
            letter-spacing: 1px;
            line-height: 1;
        }

        .hero-subtitle {
            font-size: 16px;
            color: #1c5222;
            font-weight: 500;
        }

        /* ======================================================
           6. MENU DI NAVIGAZIONE CON ICONE VETTORIALI
           ====================================================== */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 pulsanti disposti in riga */
            gap: 5px;
            padding: 8px 10px;
            text-align: center;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none; /* Rimuove la sottolineatura dai link */
        }

        /* Stile delle icone vettoriali SVG verdi */
        .nav-icon-svg {
            width: 32px;
            height: 32px;
            fill: #116b25; /* Colore verde dell'icona */
            margin-bottom: 3px;
            transition: transform 0.2s;
        }

        /* Effetto al tocco/click sull'icona */
        .nav-item:active .nav-icon-svg {
            transform: scale(0.9);
        }

        /* Etichetta sotto le icone */
        .nav-item span {
            font-size: 11px;
            font-weight: bold;
            color: #116b25;
        }

        /* ======================================================
           7. PIÈ DI PAGINA (FOOTER)
           ====================================================== */
        footer {
            background-color: #FF851B; /* Arancione principale */
            padding: 8px 12px;
            display: flex;
            justify-content: space-between; /* Telefono a sinistra, social a destra */
            align-items: center;
            flex-shrink: 0;
        }

        .info-btn img {
            height: 38px;
            width: auto;
            display: block;
        }

        /* Disposizione e distanziamento delle icone social */
        .social-icons {
            display: flex;
            gap: 20px; /* Spazio tra le varie icone social */
        }

        .social-icons a img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- CONTENITORE PRINCIPALE DELL'APP -->
    <div class="app-container">

        <!-- BLOCCON 1: INTESTAZIONE (HEADER) -->
        <header>
            <!-- Logo Gazzera Viva (Cliccabile) -->
            <a href="#">
                <img src="logo.jpg" alt="Gazzera Viva Logo" class="logo-img">
            </a>
            
            <!-- Scritta descrittiva dell'associazione (Ingrandita) -->
            <div class="header-text">
                Associazione<br>
                Commercianti<br>
                Artigiani<br>
                Gazzera
            </div>
        </header>

        <!-- BLOCCO 2: SEZIONE SOSTENITORI (OPZIONALE - NASCOSTA DAL CSS) -->
        <section class="sostenitori-section">
            <div class="sostenitori-title">Sostenitori</div>
            <div class="sostenitori-grid">
                <a href="#" class="sostenitore-card"><img src="sostenitore1.jpg" alt="Sostenitore 1"></a>
                <a href="#" class="sostenitore-card"><img src="sostenitore2.jpg" alt="Sostenitore 2"></a>
                <a href="#" class="sostenitore-card"><img src="sostenitore3.jpg" alt="Sostenitore 3"></a>

        </section>

        <!-- BLOCCO 3: SEZIONE CENTRALE CON MASCOTTE "ASSO" -->
        <section class="hero-section">
            <div class="mascotte-wrapper">
                <a href="#" style="display: flex; justify-content: center; height: 100%;">
                    <img src="mascot asso.jpg" alt="Mascotte Asso" class="mascotte-img">

            <div class="hero-title-small">Ciao sono</div>
            <div class="hero-title-main">ASSO</div>
            <div class="hero-subtitle">Mascotte dell'associazione</div>
        </section>

        <!-- BLOCCO 4: MENU CON ICONE VETTORIALI VERDI -->
        <nav class="nav-grid">
            <!-- Pulsante Prodotti -->
            <a href="https://padlet.com/gazzeraviva/offerte-antispreco-jb0svs3ohqs8ry04" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24">
                    <path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h6v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/>
                </svg>
                <span>Prodotti</span>
            </a>

            <!-- Pulsante Negozi -->
            <a href="https://padlet.com/commerciantigazzera/negozi-di-vicinato-jg2p0mn3fdllv7fg" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24">
                    <path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/>
                </svg>
                <span>Negozi</span>
            </a>

            <!-- Pulsante Eventi -->
            <a href="https://padlet.com/gazzeraviva/eventi-4qrhweyz8479wr2j" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24">
                    <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>
                </svg>
                <span>Eventi</span>
            </a>

            <!-- Pulsante Community -->
            <a href="https://padlet.com/gazzeraviva/community-eatejib5395ro1y0" class="nav-item">
                <svg class="nav-icon-svg" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <span>Community</span>
            </a>
        </nav>

        <!-- BLOCCO 5: PIÈ DI PAGINA (FOOTER) CON CONTATTI E SOCIAL -->
        <footer>
            <!-- Pulsante per Avviare la Chiamata Telefonica -->
            <a href="tel:+393518731413" class="info-btn">
                <img src="telefono.jpg" alt="INFO 3518731413">
            </a>

            <!-- Icone dei Social Network -->
            <div class="social-icons">
                <a href="https://wa.me/393518731413" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" alt="WhatsApp">
                </a>
                <a href="https://www.facebook.com/Associazione-Commercianti-Artigiani-Gazzera-566431173530554/" target="_blank">

                </a>
                <a href="https://t.me/commerciantigazzera" target="_blank">

                <a href="https://www.instagram.com/commercianti.gazzera/" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/512/1409/1409946.png" alt="Instagram">
                </a>
            </div>
        </footer>

    </div>

</body>
</html>
